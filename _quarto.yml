project:
  type: website
  resources:
    - CNAME
    - robots.txt

execute:
  freeze: true

website:
  title: "Kernyl — Airline Revenue Management & Dynamic Pricing"
  description: "Deep dives into revenue management, dynamic pricing, and online experimentation for airlines, hotels, and perishable-asset industries."
  site-url: https://www.kernyl.io
  favicon: favicon.svg
  google-analytics: "G-RCQGEPG5XP"
  search: true
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - text: Posts
        href: index.qmd
      - about.qmd
    right:
      - icon: github
        href: https://github.com/alekracicot/kernyl-blog
      - icon: rss
        href: index.xml

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-overflow: wrap
    highlight-style: github
    include-after-body:
      - text: |
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Kernyl",
            "alternateName": "Kernyl Blog",
            "url": "https://www.kernyl.io",
            "description": "Deep dives into revenue management, dynamic pricing, and online experimentation for airlines, hotels, and perishable-asset industries.",
            "publisher": {
              "@type": "Organization",
              "name": "Kernyl",
              "url": "https://www.kernyl.io"
            }
          }
          </script>
    grid:
      sidebar-width: 250px
      body-width: 850px
      margin-width: 250px
      gutter-width: 1.5em
